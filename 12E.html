<!DOCTYPE html>
<html>
    <head>
        <title>
            12E Exercises.
        </title>

        <style>
            .container{
                border: 1px solid #ccc;
                border-radius: 10px;
                padding: 10px;
                width: 300px;
            }

            .row{
                display: flex;
                justify-content: space-between;
                align-items: center;
                padding: 10px;
            }

            .badge{
                background-color: #5b7fff;
                border-radius: 50%;
                width: 32px;
                height: 32px;
                display: flex;
                justify-content: center;
                align-items: center;
                color: white;
            }
        </style>
    </head>
    <body>
        <div class="container">
            
            <div class="row">
                <p> Home </p>
                <div class="badge"> 14 </div>
            </div>
            <div class="row">
                <p> Notifications </p>
                <div class="badge"> 3 </div>
            </div>
            <div class="row">
                <p> Messages </p>
                <div class="badge"> 5 </div>
            </div>
        </div>
    </body>
</html>
